name: Validation

on:
  push:
    branches:
      - master
      - main
      - feature/astro-vue-ui
  pull_request:

jobs:
  build-test-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npm run test:install -- --with-deps

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Check dependency tree
        run: npm ls --depth=0

      - name: Build production site
        env:
          SITE_BASE_PATH: /central-supply-catalog
        run: npm run prod

      - name: Run browser regression tests
        run: npm test

      - name: Run Lighthouse budgets
        timeout-minutes: 10
        env:
          SITE_BASE_PATH: /central-supply-catalog
        run: npm run test:audit
